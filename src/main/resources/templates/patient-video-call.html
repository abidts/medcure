<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call - MedCure Kashmir</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/video-call.css}">
</head>
<body>
    <div class="video-call-container">
        <!-- Header -->
        <div class="call-header">
            <div class="call-info">
                <h2>
                    <i class="fas fa-video"></i>
                    Video Consultation
                </h2>
                <p class="appointment-details">
                    <span th:if="${requestId != null}" th:text="${'Video Call Request #' + requestId}">Request #1</span>
                    <span class="separator">•</span>
                    <span>Instant Video Call</span>
                </p>
            </div>
            <a href="/patient/dashboard" class="btn-back">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Video Container -->
        <div class="video-container">
            <!-- Remote Video (Peer) -->
            <div class="video-wrapper remote-video">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label">
                    <i class="fas fa-user-md"></i>
                    <span>Doctor</span>
                </div>
                <div class="video-status" id="remoteStatus">
                    <span class="status-indicator"></span>
                    <span class="status-text">Connecting...</span>
                </div>
            </div>

            <!-- Local Video (Self) -->
            <div class="video-wrapper local-video">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">
                    <i class="fas fa-user"></i>
                    <span>You</span>
                </div>
                <div class="video-controls-overlay">
                    <span class="recording-indicator" id="recordingIndicator" style="display: none;">
                        <i class="fas fa-circle"></i> LIVE
                    </span>
                </div>
            </div>
        </div>

        <!-- Control Bar -->
        <div class="control-bar">
            <div class="control-buttons">
                <button id="muteBtn" class="control-btn" onclick="toggleMute()" title="Mute/Unmute">
                    <i class="fas fa-microphone"></i>
                    <span class="btn-label">Mute</span>
                </button>
                <button id="cameraBtn" class="control-btn" onclick="toggleCamera()" title="Turn Camera On/Off">
                    <i class="fas fa-video"></i>
                    <span class="btn-label">Camera</span>
                </button>
                <button id="screenShareBtn" class="control-btn" onclick="toggleScreenShare()" title="Share Screen">
                    <i class="fas fa-desktop"></i>
                    <span class="btn-label">Share</span>
                </button>
            </div>
            <button id="hangupBtn" class="control-btn hangup" onclick="hangup()" title="End Call">
                <i class="fas fa-phone-slash"></i>
                <span class="btn-label">End Call</span>
            </button>
        </div>

        <!-- Status Messages -->
        <div id="statusMessage" class="status-message"></div>
        <div class="connection-quality" id="connectionQuality" style="display: none;">
            <i class="fas fa-signal"></i>
            <span class="quality-text">Good</span>
        </div>
    </div>

    <!-- WebRTC Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script th:src="@{/js/webrtc-call.js}"></script>

    <!-- Initialize Call -->
    <script>
        const CALL_CONFIG = {
            requestId: [[${requestId}]],
            username: /*[[${#authentication?.name}]]*/ 'guest',
            returnUrl: '/patient/dashboard'
        };

        window.addEventListener('DOMContentLoaded', () => {
            const username = prompt("Enter your email (for testing):", "patient@example.com");
            if (username) {
                CALL_CONFIG.username = username;
                initializeCall(CALL_CONFIG);
            } else {
                showStatus("Authentication required");
                setTimeout(() => {
                    window.location.href = CALL_CONFIG.returnUrl;
                }, 2000);
            }
        });
    </script>
</body>
</html>
