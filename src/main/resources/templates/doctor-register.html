<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Registration - Tabib24x7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 0;
        }
        .registration-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .registration-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .registration-body {
            padding: 40px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .section-title {
            color: #667eea;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 25px;
        }
        .alert-message {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="registration-container">
            <div class="registration-header">
                <h1><i class="fas fa-user-md"></i> Doctor Registration</h1>
                <p class="mb-0">Join Tabib24x7 and start serving patients</p>
            </div>
            <div class="registration-body">
                <div id="alertMessage" class="alert alert-message"></div>
                
                <form id="registrationForm">
                    <div class="form-section">
                        <h4 class="section-title"><i class="fas fa-user"></i> Personal Information</h4>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name *</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone *</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password *</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h4 class="section-title"><i class="fas fa-graduation-cap"></i> Professional Information</h4>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Qualification *</label>
                                <input type="text" class="form-control" id="qualification" placeholder="e.g., MBBS, MD" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Years of Experience *</label>
                                <input type="number" class="form-control" id="yearsOfExperience" min="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Experience Details</label>
                            <textarea class="form-control" id="experience" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Specialization *</label>
                                <select class="form-select" id="specializationId" required>
                                    <option value="">Select Specialization</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Consultation Fee (₹) *</label>
                                <input type="number" class="form-control" id="consultationFee" min="0" step="50" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h4 class="section-title"><i class="fas fa-clinic-medical"></i> Clinic Information</h4>
                        <div class="mb-3">
                            <label class="form-label">Clinic Address *</label>
                            <textarea class="form-control" id="clinicAddress" rows="2" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">District *</label>
                                <input type="text" class="form-control" id="district" placeholder="e.g., Srinagar" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">State *</label>
                                <input type="text" class="form-control" id="state" placeholder="e.g., Jammu and Kashmir" required>
                            </div>
                        </div>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-register">
                            <i class="fas fa-user-plus"></i> Register as Doctor
                        </button>
                    </div>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0">Already have an account? <a href="/login.html">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                qualification: document.getElementById('qualification').value,
                yearsOfExperience: parseInt(document.getElementById('yearsOfExperience').value),
                experience: document.getElementById('experience').value,
                specializationId: parseInt(document.getElementById('specializationId').value),
                consultationFee: parseFloat(document.getElementById('consultationFee').value),
                clinicAddress: document.getElementById('clinicAddress').value,
                district: document.getElementById('district').value,
                state: document.getElementById('state').value
            };

            try {
                const response = await fetch('/api/doctor/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const alertDiv = document.getElementById('alertMessage');
                
                if (result.success) {
                    alertDiv.className = 'alert alert-success alert-message';
                    alertDiv.textContent = 'Registration successful! Redirecting to login...';
                    alertDiv.style.display = 'block';
                    setTimeout(() => window.location.href = '/login.html', 2000);
                } else {
                    alertDiv.className = 'alert alert-danger alert-message';
                    alertDiv.textContent = result.message;
                    alertDiv.style.display = 'block';
                }
            } catch (error) {
                const alertDiv = document.getElementById('alertMessage');
                alertDiv.className = 'alert alert-danger alert-message';
                alertDiv.textContent = 'Registration failed. Please try again.';
                alertDiv.style.display = 'block';
            }
        });
    </script>

    <script>
        // Load specializations dynamically on page load
        async function loadSpecializations() {
            try {
                const response = await fetch('/api/specializations');
                const specializations = await response.json();
                
                const select = document.getElementById('specializationId');
                select.innerHTML = '<option value="">Select Specialization</option>';
                
                specializations.forEach(spec => {
                    const option = document.createElement('option');
                    option.value = spec.id;
                    option.textContent = spec.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading specializations:', error);
            }
        }

        // Load specializations when page loads
        document.addEventListener('DOMContentLoaded', loadSpecializations);
    </script>
</body>
</html>
