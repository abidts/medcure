<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MedCure Kashmir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
            margin: 0 auto;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 40px;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1.1rem;
        }
        .alert-message {
            display: none;
        }
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .role-btn.active {
            border-color: #667eea;
            background: #f0f3ff;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
            <div class="login-header">
                <h2><i class="fas fa-heartbeat"></i> MedCure Kashmir</h2>
                <p class="mb-0">Healthcare Management System</p>
            </div>
            <div class="login-body">
                <div id="alertMessage" class="alert alert-message"></div>
                
                <div class="role-selector">
                    <div class="role-btn active" onclick="selectRole('doctor')">
                        <i class="fas fa-user-md"></i> Doctor
                    </div>
                    <div class="role-btn" onclick="selectRole('patient')">
                        <i class="fas fa-user-injured"></i> Patient
                    </div>
                    <div class="role-btn" onclick="selectRole('admin')">
                        <i class="fas fa-user-shield"></i> Admin
                    </div>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-1">Don't have an account?</p>
                    <a href="/doctor-register" class="btn btn-outline-primary me-2">
                        <i class="fas fa-user-plus"></i> Register as Doctor
                    </a>
                    <a href="/patients/register" class="btn btn-outline-success">
                        <i class="fas fa-user-plus"></i> Register as Patient
                    </a>
                </div>
                
                <div class="text-center mt-3">
                    <small class="text-muted">
                        Default Admin: admin@medcure.com / admin123
                    </small>
                </div>
            </div>
        </div>

    <script>
        let selectedRole = 'doctor';

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
            event.target.closest('.role-btn').classList.add('active');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                let endpoint = '/api/auth/login';
                if (selectedRole === 'patient') {
                    endpoint = '/api/patient/login';
                }

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                const alertDiv = document.getElementById('alertMessage');
                
                if (result.success) {
                    if (selectedRole === 'patient') {
                        localStorage.setItem('patientId', result.patient.id);
                        localStorage.setItem('patientName', result.patient.name);
                        // Redirect to home page where patient can see dashboard link in navbar
                        window.location.href = '/';
                    } else if (result.user.role === 'DOCTOR') {
                        localStorage.setItem('userId', result.user.id);
                        localStorage.setItem('userEmail', result.user.email);
                        localStorage.setItem('userRole', result.user.role);
                        // Get doctor profile
                        const doctorResponse = await fetch(`/api/doctor/dashboard/profile/${result.user.id}`);
                        if (doctorResponse.ok) {
                            const doctor = await doctorResponse.json();
                            localStorage.setItem('doctorId', doctor.id);
                        }
                        window.location.href = '/doctor-dashboard';
                    } else if (result.user.role === 'ADMIN' || result.user.role === 'SUPER_ADMIN') {
                        localStorage.setItem('adminId', result.user.id);
                        localStorage.setItem('adminEmail', result.user.email);
                        localStorage.setItem('adminRole', result.user.role);
                        window.location.href = '/admin-panel';
                    }
                } else {
                    alertDiv.className = 'alert alert-danger alert-message';
                    alertDiv.textContent = result.message;
                    alertDiv.style.display = 'block';
                }
            } catch (error) {
                const alertDiv = document.getElementById('alertMessage');
                alertDiv.className = 'alert alert-danger alert-message';
                alertDiv.textContent = 'Login failed. Please check your credentials.';
                alertDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
