<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - Tabib24x7</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">
                <img src="/images/tabib24x7-logo.png" alt="Tabib24x7" style="height: 55px; max-width: 220px; object-fit: contain;">
            </a>
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"></i>
            </button>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/doctors">Find Doctors</a></li>
                <li><a href="/doctor-register" class="btn-register">Doctor Reg</a></li>
                <li><a href="/patients/register" class="btn-register">Patient Reg</a></li>
                <li><a href="/login" class="btn-login">Login</a></li>
            </ul>
        </div>
    </nav>

    <script>
        function toggleMobileMenu() {
            document.querySelector('.nav-links').classList.toggle('show');
        }
    </script>

    <section class="registration-section">
        <div class="container">
            <h1>Patient Registration</h1>
            <p>Create your patient profile to book appointments</p>

            <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}">Error message</div>

            <form class="registration-form" th:action="@{/patients}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required minlength="6" placeholder="Create a password">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required placeholder="+91 XXXXXXXXXX">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" required min="0" max="150" placeholder="Enter your age">
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender:</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="bloodGroup">Blood Group:</label>
                        <select id="bloodGroup" name="bloodGroup" required>
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="address">Address:</label>
                        <textarea id="address" name="address" rows="2" placeholder="Enter your address"></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Register</button>
                    <a href="/" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div style="margin-bottom: 15px;">
                <img src="/images/tabib24x7-logo.png" alt="Tabib24x7" style="height: 45px; max-width: 200px; object-fit: contain; opacity: 0.95;">
            </div>
            <p>&copy; 2026 Tabib24x7. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
