<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - MedCure Kashmir</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            max-width: 450px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 40px;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1.1rem;
        }
        .alert-message {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <h2><i class="fas fa-user-injured"></i> Patient Login</h2>
                <p class="mb-0">Access your health records</p>
            </div>
            <div class="login-body">
                <div id="alertMessage" class="alert alert-message"></div>
                <div th:if="${param.registered}" class="alert alert-success mb-3">
                    <i class="fas fa-check-circle"></i> Registration successful! Please login.
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-1">Don't have an account?</p>
                    <a href="/patients/register" class="btn btn-outline-primary">
                        <i class="fas fa-user-plus"></i> Register Here
                    </a>
                </div>
                
                <div class="text-center mt-3">
                    <a href="/login" class="text-muted">
                        <i class="fas fa-arrow-left"></i> Back to Main Login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/patient/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();
                const alertDiv = document.getElementById('alertMessage');

                if (result.success) {
                    localStorage.setItem('patientId', result.patient.id);
                    localStorage.setItem('patientName', result.patient.name);
                    // Redirect to home page where patient can see dashboard link in navbar
                    window.location.href = '/';
                } else {
                    alertDiv.className = 'alert alert-danger alert-message';
                    alertDiv.textContent = result.message;
                    alertDiv.style.display = 'block';
                }
            } catch (error) {
                const alertDiv = document.getElementById('alertMessage');
                alertDiv.className = 'alert alert-danger alert-message';
                alertDiv.textContent = 'Login failed. Please check your credentials.';
                alertDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
