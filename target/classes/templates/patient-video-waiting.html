<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting for Doctor - Tabib24x7</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .waiting-container {
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            text-align: center;
        }
        .waiting-icon {
            font-size: 5rem;
            color: #667eea;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            background: #fff3cd;
            color: #856404;
            border-radius: 20px;
            font-weight: 600;
            margin: 20px 0;
        }
        .doctor-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        .btn-cancel {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-cancel:hover {
            background: #c82333;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="waiting-container">
            <i class="fas fa-clock waiting-icon"></i>
            <h2 class="mb-3">Waiting for Doctor</h2>
            <p class="text-muted">Your video call request has been sent. Please wait while the doctor accepts your request.</p>
            
            <div class="status-badge">
                <i class="fas fa-spinner fa-spin"></i> Pending Acceptance
            </div>

            <div class="doctor-info" th:if="${doctorName != null}">
                <h5><i class="fas fa-user-md"></i> <span th:text="${doctorName}">Dr. Name</span></h5>
                <p class="text-muted mb-0">Waiting for doctor to accept your call request</p>
            </div>

            <div class="spinner" id="loadingSpinner"></div>
            <p class="text-muted" id="statusText">Connecting to call server...</p>

            <div class="mt-4">
                <button class="btn btn-cancel" onclick="cancelRequest()">
                    <i class="fas fa-times"></i> Cancel Request
                </button>
                <button class="btn btn-primary ms-2" onclick="checkRequestStatus()" style="background: #667eea; border: none;">
                    <i class="fas fa-sync"></i> Check Now
                </button>
            </div>

            <div class="mt-3">
                <a href="/patient/dashboard" class="text-muted">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const requestId = /*[[${requestId}]]*/ null;
        const patientId = /*[[${patientId}]]*/ null;
        let checkStatusInterval = null;
        let pollCount = 0;

        // Check request status periodically
        async function checkRequestStatus() {
            try {
                pollCount++;
                console.log('Checking status (poll #' + pollCount + ')...');
                
                // Add cache-busting parameter
                const response = await fetch(`/patient/video-call/request/${requestId}/status?t=${Date.now()}`);
                const data = await response.json();

                console.log('Status response:', data);

                if (data.status === 'ACCEPTED') {
                    // Doctor accepted, redirect to video call
                    alert('Doctor accepted your call! Connecting to video consultation...');
                    window.location.href = '/patient/video-call?requestId=' + requestId;
                } else if (data.status === 'REJECTED') {
                    alert('Doctor rejected the call request.');
                    window.location.href = '/patient/dashboard';
                } else if (data.status === 'COMPLETED' || data.status === 'MISSED') {
                    alert('Call has ended.');
                    window.location.href = '/patient/dashboard';
                } else if (data.status === 'PENDING') {
                    document.getElementById('statusText').textContent = 'Waiting for doctor to accept... (Polling: ' + pollCount + ')';
                }
            } catch (error) {
                console.error('Error checking status:', error);
                document.getElementById('statusText').textContent = 'Connection error. Retrying...';
            }
        }

        function cancelRequest() {
            if (confirm('Are you sure you want to cancel this video call request?')) {
                fetch(`/patient/video-call/request/${requestId}/cancel`, {
                    method: 'POST'
                }).then(() => {
                    window.location.href = '/patient/dashboard';
                });
            }
        }

        // Start checking status
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Starting status polling for request ' + requestId);
            // Check immediately
            checkRequestStatus();
            // Then poll every 2 seconds
            checkStatusInterval = setInterval(checkRequestStatus, 2000);
            
            // Update status text
            document.getElementById('statusText').textContent = 'Waiting for doctor to accept...';
        });
    </script>
</body>
</html>
